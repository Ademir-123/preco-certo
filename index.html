<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Preço Certo</title>
<style>
:root{color-scheme:light;--g:#0f7a2a;--gl:#e6f4e9;--ink:#0f1f33;--mut:#6b7280;--bd:#e5e7eb;--chip:#f3f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box;margin:0}
html{color-scheme:light;background:#fff;scroll-padding-top:env(safe-area-inset-top,0px)}
body{color-scheme:light;overflow-anchor:none;background:#fff!important;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;padding:14px 16px 120px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;cursor:pointer;color:inherit}
/* O Preço Certo usa sempre a aparência clara, independentemente do tema do celular. */
input,select,textarea,button{color-scheme:light}
@media (prefers-color-scheme: dark){html,body{background:#fff!important;color:var(--ink)!important}input,select,textarea{color:var(--ink)}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.brand{display:flex;align-items:center;flex:1;min-width:0}
.brand-logo{display:block;width:min(100%,190px);height:auto;object-fit:contain}
.tools{display:flex;gap:7px;align-items:center;margin-top:6px;flex:none}
.loc{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:13px;font-weight:600;box-shadow:0 1px 3px #0001;max-width:150px;padding:8px;font-size:12px}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc .p{color:var(--g);font-size:19px}
.bell{position:relative;font-size:27px;background:none;border:0}
.bell i{position:absolute;top:0;right:1px;width:10px;height:10px;border-radius:50%;background:#ef4444}
.search{margin-top:14px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:0 16px;height:52px;box-shadow:0 1px 3px #0001}
.search svg{font-size:23px;color:var(--mut)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px;min-width:0}
.cats{display:flex;gap:10px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;height:78px;border-radius:16px;border:1px solid var(--bd);background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600}
.cat svg{font-size:26px}
.cat.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 4px 10px #0f7a2a55}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec h2{font-size:17px;display:flex;gap:8px;align-items:center;font-weight:700}
.sec h2 svg{color:var(--g)}
.link{color:var(--g);font-weight:700;font-size:14px;background:none;border:0;display:flex;align-items:center}
.card{position:relative;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:12px;box-shadow:0 1px 4px #0000000d}
.img{width:64px;height:64px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;position:relative;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover}.photo-preview{width:100%;height:150px;object-fit:contain;background:var(--chip);border-radius:12px;margin-top:8px;display:none}.admin-photo{width:48px;height:48px;object-fit:cover;border-radius:8px;background:var(--chip);flex:none}
.heart{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;padding:0}
.heart.on{color:#ef4444}.heart.on svg{fill:#ef4444}
.info{flex:1;min-width:0}
.info h3{font-size:14px;font-weight:700;line-height:1.2}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.mk{display:flex;gap:10px;align-items:center;font-size:12px;margin-top:5px;font-weight:600;flex-wrap:wrap}
.mk span{display:flex;gap:4px;align-items:center}
.mk .d{color:var(--mut);font-weight:500}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.pr b{font-size:22px;color:var(--g);font-weight:800;letter-spacing:-.5px}
.pr s{font-size:12px;color:var(--mut)}
.val{display:inline-flex;gap:5px;align-items:center;background:var(--gl);color:var(--g);font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;margin-top:3px}
.btns{display:flex;flex-direction:column;gap:8px;width:124px;flex:none}
.btn{height:38px;border-radius:9px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;padding:0 10px}
.btn.p{background:var(--g);color:#fff;border:0}
.btn.s{background:#fff;border:1.5px solid var(--bd)}
.btn.w{width:100%;height:44px;font-size:14px}
.btn svg{font-size:15px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 62px repeat(3,minmax(0,1fr));justify-items:center;align-items:end;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--mut);position:relative;padding:4px 0;min-width:0;width:100%}
nav button svg{font-size:22px}
nav button.on{color:var(--g);font-weight:700}
nav button.on::after{content:"";position:absolute;bottom:-8px;width:60px;height:3px;border-radius:3px;background:var(--g)}
nav .mid{width:62px;height:62px;border-radius:50%;background:var(--g);color:#fff;margin-top:-30px;border:4px solid #fff;box-shadow:0 4px 12px #0f7a2a55;padding:0;justify-content:center}
nav .mid::after{display:none}
nav .mid svg{font-size:28px}
nav em{position:absolute;top:-2px;right:4px;background:var(--g);color:#fff;font-size:10px;font-style:normal;border-radius:99px;padding:1px 5px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:92%;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 0;font-size:14px}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:18px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:13px}
.row:last-child{border:0}
.tag{font-size:10.5px;font-weight:700;background:var(--gl);color:var(--g);border-radius:99px;padding:2px 8px}
.tag.w{background:#fef3c7;color:#92400e}
.chips{display:flex;gap:8px;margin:6px 0 8px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-weight:700}
.x{background:none;border:0;color:#ef4444;font-size:20px}
form label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
form input,form select{width:100%;height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--mut);background:var(--chip);border-radius:10px;padding:10px;margin:10px 0}
.box{border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.chk{width:20px;height:20px;accent-color:var(--g)}
.done{text-decoration:line-through;color:var(--mut)}

.promotion-card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0000000d}
.promo-card-head{display:flex;align-items:flex-start;gap:11px}
.promo-icon{width:46px;height:46px;flex:none;border-radius:12px;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:24px}
.promo-icon svg{font-size:24px}
.promo-card-title{font-size:15px;font-weight:800;line-height:1.25}
.promo-card-market{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--mut);margin-top:5px}
.promo-card-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.promo-validity{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
.promo-validity svg{color:var(--g)}
.promo-detail{border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;background:linear-gradient(145deg,#f4fbf5,#fff 75%)}
.promo-detail h2{font-size:22px;line-height:1.2;margin:8px 0}
.promo-detail p{font-size:13px;color:var(--mut);line-height:1.45;margin-top:8px}
.promo-back{display:flex;align-items:center;gap:5px;background:none;border:0;color:var(--g);font-weight:700;font-size:14px;padding:4px 0;margin:4px 0 14px}
.promo-items-heading{font-size:16px;font-weight:800;margin:18px 0 10px}

.compare-card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 1px 4px #0000000d}
.compare-card-main{display:flex;align-items:center;gap:10px;min-width:0}
.compare-product-icon{width:44px;height:44px;flex:none;border-radius:12px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:24px}
.compare-product-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.compare-product-info b{font-size:13px;line-height:1.25}
.compare-product-info span,.compare-product-info small,.compare-best small{font-size:11px;color:var(--mut)}
.compare-best{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.compare-best strong{font-size:16px;color:var(--g);white-space:nowrap}
.compare-card-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:9px;margin-top:10px;font-size:11px;color:var(--mut)}
.compare-open{margin-left:auto;font-size:12px;font-weight:800;color:var(--g)}


/* Área do administrador do mercado */
.admin-hero{padding:16px;border:1px solid #cfe8d5;border-radius:18px;background:linear-gradient(145deg,#e8f8ec,#fff 78%);margin-bottom:14px}
.admin-hero-top{display:flex;align-items:center;gap:12px}
.admin-store-photo{width:76px;height:76px;border-radius:16px;object-fit:cover;background:#dff3e4;display:grid;place-items:center;flex:none;font-size:30px;border:1px solid #cce8d3}
.admin-store-name{font-size:20px;font-weight:850;color:#14532d;line-height:1.2;overflow-wrap:anywhere}
.admin-store-meta{font-size:12px;color:#477257;line-height:1.5;margin-top:5px;overflow-wrap:anywhere}
.admin-section-title{font-size:16px;font-weight:850;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.admin-section-title span{font-size:12px;font-weight:650;color:var(--mut)}
.admin-panel{border:1px solid #dcebe0;border-radius:16px;background:#fff;padding:15px;margin-bottom:14px;box-shadow:0 2px 7px #14532d08}
.admin-panel form label{color:#334155}
.admin-panel .sub{line-height:1.45}
.admin-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.admin-item:last-child{border-bottom:0;padding-bottom:0}
.admin-item-photo{width:54px;height:54px;border-radius:11px;object-fit:cover;flex:none;background:#f1f5f9;display:grid;place-items:center;font-size:25px;overflow:hidden}
.admin-item-main{flex:1;min-width:0}
.admin-item-title{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.admin-item-meta{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.4}
.admin-delete{border:1px solid #fecaca;color:#b91c1c;background:#fff;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:750;flex:none}
.admin-inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-picks{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-height:175px;overflow:auto;margin-top:7px}
.admin-pick{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px;border-bottom:1px solid #f1f5f9}
.admin-pick:last-child{border-bottom:0}
.admin-pick input{width:17px;height:17px;flex:none;accent-color:var(--g)}
.admin-pick span{min-width:0;overflow-wrap:anywhere}
.admin-status{padding:12px;border:1px solid #f3d4a4;border-radius:12px;background:#fffaf0;color:#854d0e;font-size:13px;line-height:1.5}
@media(max-width:360px){.admin-inline{grid-template-columns:1fr}.admin-hero-top{align-items:flex-start}.admin-store-photo{width:62px;height:62px}}

</style>
</head>

  S.adminProducts=(productResult.data||[]).map(function(o){return{id:String(o.id),n:o.n||"Produto",s:o.s||"",m:String(o.m),p:Number(o.p||0),o:Number(o.o||0),v:o.v||"",c:o.c||"alimentos",img:o.img||""}});
  var promoResult=await supabaseClient.from("promotions").select("*").eq("market_id",String(S.adminMarket.id)).order("created_at",{ascending:false});
  if(promoResult.error)throw promoResult.error;
  var rawPromos=promoResult.data||[], promoItems=[];
  if(rawPromos.length){var itemResult=await supabaseClient.from("promotion_items").select("promotion_id,offer_id,position").in("promotion_id",rawPromos.map(function(p){return p.id}));if(itemResult.error)throw itemResult.error;promoItems=itemResult.data||[]}

  S.adminAccess=true;S.adminError="";return true;
 }catch(err){console.error("Falha ao carregar o perfil do mercado:",err);S.adminAccess=false;S.adminMarket=null;S.adminProducts=[];S.adminPromotions=[];S.adminError=err.message||"Não foi possível carregar os dados do mercado.";return false}
 finally{S.adminLoading=false}
}

    if(result.error)throw result.error;
    if(!result.data.session){toast("Cadastro iniciado! Confirme o e-mail. Depois entre pela Área de administradores para enviar sua solicitação de cadastro; ela será criada após a confirmação.");S.adminMode="login";R();return}
    S.user=result.data.user||null;
    var ok=await loadAdminProfile();
    if(!ok&&S.adminPending){S.view="prof";S.adminMode="login";R();toast("Solicitação enviada! Seu mercado aguarda aprovação.");return}
    if(!ok)throw new Error(S.adminError||"Não foi possível enviar a solicitação de cadastro.");
    if(immediatePhoto&&S.adminAccess){var photoUrl=await uploadMarketAsset(immediatePhoto,"market");var upMarket=await supabaseClient.from("markets").update({photo_url:photoUrl,updated_at:new Date().toISOString()}).eq("id",String(S.adminMarket.id));if(upMarket.error)throw upMarket.error;}
    await loadRemoteData();await loadAdminProfile();S.view="prof";S.adminMode="login";R();toast("Cadastro enviado para aprovação.");
   }else{
    result=await supabaseClient.auth.signInWithPassword({email:email,password:password});
    if(result.error)throw result.error;
    var user=result.data.user;
    if(!user||!user.user_metadata||user.user_metadata.account_type!=="market_admin"){await supabaseClient.auth.signOut();throw new Error("Esta conta não está cadastrada como administrador de mercado.")}
    S.user=user;
    var linked=await loadAdminProfile();
    if(!linked&&!S.adminPending&&!S.adminRejected){await supabaseClient.auth.signOut();throw new Error(S.adminError||"Não foi possível localizar o mercado vinculado a esta conta.")}
    S.view="prof";S.adminMode="login";R();
    toast(S.adminPending?"Login realizado. Sua solicitação aguarda aprovação.":S.adminRejected?"Sua solicitação ainda não foi aprovada.":"Login de administrador realizado.");
   }
  }catch(err){console.error("Erro na área administrativa:",err);toast(err.message||"Não foi possível concluir a operação")}
  finally{var current=$("adminForm");if(current){var b2=current.querySelector('button[type="submit"]');if(b2){b2.disabled=false;b2.textContent=S.adminMode==="signup"?"Criar conta de administrador":"Entrar como administrador"}}}
  return;
 }
 if(form.id==="marketProfileForm"){
  e.preventDefault();if(!S.adminAccess||!S.adminMarket){toast("Entre como administrador do mercado.");return}
  var saveBtn=form.querySelector('button[type="submit"]');saveBtn.disabled=true;saveBtn.textContent="Salvando...";
  try{
   var photoFile=$("marketPhotoEdit").files[0], photoUrl=S.adminMarket.photo_url||"";
   if(photoFile)photoUrl=await uploadMarketAsset(photoFile,"market");
   var patch={n:$("editMarketName").value.trim(),owner_name:$("editMarketOwner").value.trim()||null,address:$("editMarketAddress").value.trim(),phone:$("editMarketPhone").value.trim()||null,description:$("editMarketDescription").value.trim(),photo_url:photoUrl||null,updated_at:new Date().toISOString()};
   var mr=await supabaseClient.from("markets").update(patch).eq("id",String(S.adminMarket.id));if(mr.error)throw mr.error;
   toast("Perfil do mercado salvo.");await loadRemoteData();await loadAdminProfile();R();
  }catch(err){console.error(err);toast(err.message||"Não foi possível salvar o perfil do mercado.")}
  finally{var c=$("marketProfileForm");if(c){var sb=c.querySelector('button[type="submit"]');if(sb){sb.disabled=false;sb.textContent="Salvar perfil do mercado"}}}
  return;
 }
 if(form.id==="productForm"){
  e.preventDefault();if(!S.adminAccess||!S.adminMarket){toast("Entre como administrador do mercado.");return}
  var productBtn=form.querySelector('button[type="submit"]');productBtn.disabled=true;productBtn.textContent="Cadastrando...";
  try{
   var price=Number($("productPrice").value), oldValue=$("productOldPrice").value.trim(), oldPrice=oldValue?Number(oldValue):0;
   if(!Number.isFinite(price)||price<0)throw new Error("Informe um preço válido.");
   if(oldPrice!==0&&(!Number.isFinite(oldPrice)||oldPrice<=price))throw new Error("O preço anterior deve ser maior que o preço atual.");
   var productPhoto=$("productPhoto").files[0], productImage=productPhoto?await uploadMarketAsset(productPhoto,"products"):null;
   var data={id:makeRecordId(),n:$("productName").value.trim(),s:$("productSize").value.trim(),m:String(S.adminMarket.id),p:price,o:oldPrice,v:$("productValidity").value||null,c:$("productCategory").value,img:productImage};
   var ins=await supabaseClient.from("offers").insert(data);if(ins.error)throw ins.error;
   toast("Produto cadastrado.");form.reset();await loadRemoteData();await loadAdminProfile();R();
  }catch(err){console.error(err);toast(err.message||"Não foi possível cadastrar o produto.")}
  finally{var c=$("productForm");if(c){var pb=c.querySelector('button[type="submit"]');if(pb){pb.disabled=false;pb.textContent="Cadastrar produto"}}}
  return;
 }
 if(form.id==="promotionForm"){
  e.preventDefault();if(!S.adminAccess||!S.adminMarket){toast("Entre como administrador do mercado.");return}
  var promoBtn=form.querySelector('button[type="submit"]');promoBtn.disabled=true;promoBtn.textContent="Criando...";
  try{
   var from=$("promotionFrom").value, until=$("promotionUntil").value;
   if(!from||!until||until<from)throw new Error("A data final deve ser igual ou posterior à data inicial.");
   var selected=Array.from(form.querySelectorAll('input[name="promotionOfferIds"]:checked')).map(function(ch){return ch.value});
   if(!selected.length)throw new Error("Selecione ao menos um produto para a promoção.");
   var promoPhoto=$("promotionPhoto").files[0], promoImage=promoPhoto?await uploadMarketAsset(promoPhoto,"promotions"):null;
   var promoId=makeRecordId();
   var pdata={id:promoId,title:$("promotionTitle").value.trim(),market_id:String(S.adminMarket.id),description:$("promotionDescription").value.trim(),valid_from:from,valid_until:until,image_url:promoImage||null};
   var pi=await supabaseClient.from("promotions").insert(pdata);if(pi.error)throw pi.error;
   var links=selected.map(function(id,ix){return{promotion_id:promoId,offer_id:id,position:ix}});
   var linkResult=await supabaseClient.from("promotion_items").insert(links);
   if(linkResult.error){await supabaseClient.from("promotions").delete().eq("id",promoId).eq("market_id",String(S.adminMarket.id));throw linkResult.error}
   toast("Promoção criada.");form.reset();await loadRemoteData();await loadAdminProfile();R();
  }catch(err){console.error(err);toast(err.message||"Não foi possível criar a promoção.")}
  finally{var c=$("promotionForm");if(c){var pb=c.querySelector('button[type="submit"]');if(pb){pb.disabled=false;pb.textContent="Criar promoção"}}}
  return;
 }
 if(form.id!=="loginForm")return;
 e.preventDefault();var email=$("loginEmail").value.trim(),password=$("loginPassword").value,btn=form.querySelector('button[type="submit"]');if(!supabaseClient){toast("O login está temporariamente indisponível. Tente novamente.");return}btn.disabled=true;btn.textContent="Aguarde...";
 try{var result=S.authMode==="signup"?await supabaseClient.auth.signUp({email:email,password:password}):await supabaseClient.auth.signInWithPassword({email:email,password:password});if(result.error)throw result.error;if(S.authMode==="signup"&&!result.data.session){toast("Conta criada! Confira seu e-mail para confirmar o cadastro.");S.authMode="login";R();return}S.authMode="login";S.user=result.data.user||null;S.view="prof";await loadAdminProfile();toast(S.user?"Login realizado com sucesso":"Cadastro realizado");R()}
 catch(err){console.error("Erro de autenticação:",err);toast(err.message||"Não foi possível autenticar")}
 finally{var current=$("loginForm");if(current){var lb=current.querySelector('button[type="submit"]');if(lb){lb.disabled=false;lb.textContent=S.authMode==="signup"?"Criar conta":"Entrar"}}}
});
initAuth();
R();
loadRemoteData();
if(!S.loc&&S.view!=="login")setTimeout(locSheet,600);
</script>
</body>
</html>
